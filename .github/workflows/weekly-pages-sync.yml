name: Weekly Pages Sync

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      sync_data:
        description: Refresh Google Sheets before publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/patchsync/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Go tests and race detector
        working-directory: tools/patchsync
        run: go test -race ./...
      - name: Go vet
        working-directory: tools/patchsync
        run: go vet ./...
      - name: JavaScript regression tests and catalog validation
        run: node --test tests/*.test.mjs

  sync-and-publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/patchsync/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve latest published data
        run: node tools/prepare-publish.mjs
      - name: Sync all configured games
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync_data)
        run: |
          set -euo pipefail
          cp .env.example .env
          cd tools/patchsync
          for game in arknights-endfield wuthering-waves zenless-zone-zero genshin-impact honkai-star-rail; do
            go run . --game "$game"
          done
      - name: Validate final site data before publishing
        run: node --test tests/*.test.mjs
      - name: Publish refreshed site to github-pages
        env:
          TARGET_BRANCH: github-pages
        run: |
          set -euo pipefail
          target_dir="$RUNNER_TEMP/github-pages"
          git worktree add --track -B "$TARGET_BRANCH" "$target_dir" "origin/$TARGET_BRANCH"
          cleanup() {
            git worktree remove --force "$target_dir" || true
          }
          trap cleanup EXIT
          find "$target_dir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R assets docs src "$target_dir/"
          cp .gitignore CNAME LICENSE README.md index.html "$target_dir/"
          git -C "$target_dir" add -A
          if git -C "$target_dir" diff --cached --quiet; then
            echo "No github-pages changes to publish"
            exit 0
          fi
          git -C "$target_dir" config user.name "github-actions[bot]"
          git -C "$target_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$target_dir" commit -m "deploy: publish validated site and data"
          git -C "$target_dir" push origin HEAD:"$TARGET_BRANCH"
